[project]
name = "reviewpilot-api"
version = "0.1.0"
description = "ReviewPilot AI — FastAPI backend (modular monolith) and ARQ worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.38",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "cryptography>=44",
  "httpx>=0.28",
  "arq>=0.26",
  "redis>=5.2",
  "segno>=1.6",
  "pillow>=11",
  "reportlab>=4.2",
  "python-multipart>=0.0.20",
  "boto3>=1.35",
  "sentry-sdk[fastapi]>=2.74.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# The codebase favours long single-line expressions; this is the width the import sorter wraps at.
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",   # long lines are house style; not enforced
  "E741",   # `l` is the idiomatic name for locations/lines in comprehensions here
  "B008",   # FastAPI `Depends()` / `Query()` in argument defaults
  "B904",   # AppError translation inside `except` intentionally hides the low-level cause
  "B905",   # zip() over equal-length sequences; strict= adds noise
  "UP037",  # quoted forward refs (SQLAlchemy Mapped["X"]) are harmless with __future__ annotations
  "UP046",  # keep typing.Generic for Pydantic generic models
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
