[project]
name = "reviewpilot-api"
version = "0.1.0"
description = "ReviewPilot AI — FastAPI backend (modular monolith) and ARQ worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.38",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "cryptography>=44",
  "httpx>=0.28",
  "arq>=0.26",
  "redis>=5.2",
  "segno>=1.6",
  "pillow>=11",
  "reportlab>=4.2",
  "python-multipart>=0.0.20",
  "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
