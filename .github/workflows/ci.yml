name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reviewpilot
          POSTGRES_PASSWORD: reviewpilot
          POSTGRES_DB: reviewpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # tests/conftest.py sets the rest; Redis is intentionally absent so jobs run inline.
      TEST_DATABASE_URL: postgresql+asyncpg://reviewpilot:reviewpilot@localhost:5432/reviewpilot_test
      PGPASSWORD: reviewpilot
    steps:
      - uses: actions/checkout@v4

      - name: Create test database
        run: psql -h localhost -U reviewpilot -d reviewpilot -c "CREATE DATABASE reviewpilot_test OWNER reviewpilot"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check app tests

      - name: Pytest
        run: uv run pytest -q

  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @reviewpilot/web exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @reviewpilot/web exec eslint .

      - name: Unit tests
        run: pnpm --filter @reviewpilot/web test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        env:
          # No API in CI: the pricing page's plan fetch falls back to static plans on failure.
          BACKEND_URL: http://127.0.0.1:9
        run: pnpm --filter @reviewpilot/web build
